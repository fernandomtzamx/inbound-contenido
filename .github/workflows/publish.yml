name: Publicar en WordPress

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "images/**"
      - "docs/sitio.yml"
      - "docs/auditoria.txt"
      - "docs/importar.txt"
      - "docs/buscar.txt"
      - "docs/inventario.txt"
      - "scripts/publish.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = probar credenciales, all = republicar todo content/, setup = aplicar docs/sitio.yml"
        required: true
        default: check
        type: choice
        options: [check, all, setup]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      - name: Diagnóstico de secretos (sin revelar valores)
        run: |
          for v in WP_URL WP_USER WP_APP_PASSWORD; do
            if [ -n "${!v}" ]; then echo "$v: presente"; else echo "$v: FALTA"; fi
          done | tee -a publish.log
          # Usuario visible (no es secreto) y forma de la contraseña sin revelarla.
          U="$(printf '%s' "$WP_USER" | tr -d '[:space:]')"
          P="$(printf '%s' "$WP_APP_PASSWORD" | tr -d '[:space:]')"
          echo "WP_USER recibido: ${U:0:1}…${U: -1} (${#U} caracteres)" | tee -a publish.log
          echo "WP_APP_PASSWORD sin espacios: ${#P} caracteres (debe ser 24); solo letras y números: $( [[ "$P" =~ ^[A-Za-z0-9]+$ ]] && echo sí || echo no)" | tee -a publish.log

      - name: Publicar
        id: publicar
        run: |
          set -o pipefail
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$MODE" = "all" ]; then ARGS="--all"; elif [ "$MODE" = "setup" ]; then python scripts/site_setup.py 2>&1 | tee -a publish.log; exit ${PIPESTATUS[0]}; else ARGS="--check"; fi
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              FILES=$(git ls-files 'content/*.md' 'content/**/*.md')
            else
              FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'content/')
            fi
            if git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null | grep -q '^docs/sitio.yml$' || [ -z "$BEFORE" ]; then
              python scripts/site_setup.py 2>&1 | tee -a publish.log
            fi
            if git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null | grep -q '^docs/auditoria.txt$'; then
              python scripts/audit.py 2>&1 | tee -a publish.log
            fi
            if git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null | grep -q '^docs/buscar.txt$'; then
              python scripts/buscar.py 2>&1 | tee -a publish.log
            fi
            if git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null | grep -q '^docs/inventario.txt$'; then
              python scripts/inventario.py 2>&1 | tee -a publish.log
            fi
            if git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null | grep -q '^docs/importar.txt$'; then
              python scripts/import_raw.py 2>&1 | tee -a publish.log
            fi
            FILES=$(echo "$FILES" | grep '\.md$' | tr '\n' ' ' || true)
            if [ -z "$FILES" ]; then ARGS="--check"; else ARGS="$FILES"; fi
          fi
          echo "Argumentos: $ARGS" | tee -a publish.log
          python scripts/publish.py $ARGS 2>&1 | tee -a publish.log

      - name: Guardar registro en el repo
        if: always()
        run: |
          mkdir -p registro
          {
            echo "fecha: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: ${{ github.sha }}"
            echo "evento: ${{ github.event_name }}"
            echo "resultado: ${{ steps.publicar.outcome }}"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "---"
            cat publish.log 2>/dev/null || echo "(sin log)"
          } > registro/ultima-publicacion.log
          mkdir -p registro/logs
          cp registro/ultima-publicacion.log "registro/logs/$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA:0:7}.log"
          git config user.name "inbound-bot"
          git config user.email "inbound-bot@users.noreply.github.com"
          git add registro/ultima-publicacion.log registro/logs
          [ -f registro/auditoria.json ] && git add registro/auditoria.json
          [ -d registro/raw ] && git add registro/raw
          [ -f registro/busqueda.json ] && git add registro/busqueda.json
          [ -f registro/inventario.json ] && git add registro/inventario.json
          [ -d registro/img ] && git add registro/img
          [ -d registro/listas ] && git add registro/listas
          git commit -m "Registro de publicación [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 7))
          done
          exit 1
